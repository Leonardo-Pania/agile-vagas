<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Agile Consultoria</title>
<style>
  :root {
    /* Paleta escolhida pela cliente: vinho #7A1026, dourado #B7892B, creme #F3E2C7, marrom #2B1B1F, rosé #CAA1A7 */
    --marca: #7A1026; --marca-2: #94203A; --destaque: #B7892B; --marca-suave: #F6EAEC; --verde: #128c4b; --verde-escuro: #0d6e3a;
    --fundo: #FCF8F2; --cartao: #ffffff; --texto: #2B1B1F; --suave: #6E5A5E; --borda: #EADDD3;
    --topo-1: #FFFBF4; --topo-2: #F3E2C7; --rose: #CAA1A7;
    --alerta: #9a5b00; --alerta-fundo: #fff4d6; --ok: #11743f; --ok-fundo: #e3f5ea; --perigo: #b42318;
    --raio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { padding-bottom: 120px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .oculto { display: none !important; }
  .pagina { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  header.topo { background: linear-gradient(160deg, var(--topo-1), var(--topo-2)); color: var(--marca); padding: 14px 0 16px;
    border-bottom: 1px solid #E8D5BC;
    padding-top: calc(14px + env(safe-area-inset-top)); }
  .topo .linha { display: flex; align-items: center; gap: 12px; }
  .topo h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: .2px; }
  .topo .sub { color: var(--suave); font-size: 13px; margin-top: 2px; }
  .icone-btn { background: rgba(122,16,38,.08); border: 0; border-radius: 10px; width: 40px; height: 40px;
    display: grid; place-items: center; color: var(--marca); }
  .icone-btn svg { width: 22px; height: 22px; }

  .btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 650; display: inline-flex;
    align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-primario { background: var(--marca); color: #FFF4E3; box-shadow: 0 4px 12px rgba(122,16,38,.18); width: 100%; margin-top: 14px; font-size: 17px; }
  .btn-claro { background: var(--marca-suave); color: var(--marca); }
  .btn-perigo-claro { background: #fdecea; color: var(--perigo); }
  .btn-verde { background: var(--verde); color: #fff; }
  .btn-pequeno { min-height: 40px; padding: 8px 14px; font-size: 15px; border-radius: 10px; }
  .girando { width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  .faixa { border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; font-size: 14.5px; }
  .faixa.alerta { background: var(--alerta-fundo); color: #6b4000; }
  .faixa.info { background: var(--marca-suave); color: var(--marca); }
  .faixa.erro { background: #fdecea; color: var(--perigo); }

  h2.secao { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--suave);
    margin: 22px 2px 10px; font-weight: 700; }

  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio);
    margin-bottom: 12px; overflow: hidden; transition: opacity .25s, transform .25s; }
  .cartao.saindo { opacity: 0; transform: translateX(40px); }
  .cartao .resumo { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  .miniatura { width: 68px; height: 85px; border-radius: 10px; flex: none; background: #EFE2E4 center/cover; }
  .cartao .info { flex: 1; min-width: 0; }
  .cartao .titulo { font-weight: 700; font-size: 16.5px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cartao .empresa { color: var(--suave); font-size: 14.5px; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .selos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .selo { font-size: 12.5px; font-weight: 650; border-radius: 999px; padding: 3px 9px; }
  .selo.ok { background: var(--ok-fundo); color: var(--ok); }
  .selo.alerta { background: var(--alerta-fundo); color: var(--alerta); }
  .selo.neutro { background: #F2E9E2; color: var(--suave); }
  .cartao .acoes { display: flex; gap: 8px; padding: 0 12px 12px; }
  .cartao .acoes .btn { flex: 1; }
  .ordem { font-size: 12px; font-weight: 700; color: var(--marca); background: var(--marca-suave); border-radius: 6px;
    padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }

  .editor { border-top: 1px solid var(--borda); padding: 14px 12px; background: #fafbfd; }
  .editor img.arte { width: 100%; border-radius: 12px; display: block; background: #EFE2E4; aspect-ratio: 4 / 5; }
  .campo { margin-top: 12px; }
  .campo label { display: block; font-size: 13px; font-weight: 650; color: var(--suave); margin-bottom: 4px; }
  .campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--borda); border-radius: 10px;
    padding: 11px 12px; background: #fff; min-height: 46px; }
  .campo textarea { font: inherit; line-height: 1.4; resize: vertical; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--marca-2); outline-offset: 0; border-color: transparent; }
  .campo .dica { font-size: 12.5px; color: var(--suave); margin-top: 4px; }
  .duas { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  .previa { white-space: pre-wrap; background: #e7f5ec; border-radius: 10px; padding: 12px; font-size: 14.5px;
    margin-top: 12px; word-break: break-word; }
  .aviso-cartao { font-size: 13.5px; color: #6b4000; background: var(--alerta-fundo); border-radius: 10px;
    padding: 9px 11px; margin: 0 12px 12px; }

  details.descartadas { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio);
    padding: 4px 14px; margin-top: 18px; }
  details.descartadas summary { padding: 12px 0; font-weight: 650; color: var(--suave); cursor: pointer; }
  .descartada { padding: 10px 0; border-top: 1px solid var(--borda); font-size: 14.5px; }
  .descartada .motivo { color: var(--perigo); font-size: 13px; margin-top: 2px; }
  .descartada a { color: var(--marca-2); }

  .vazio { text-align: center; color: var(--suave); padding: 36px 12px; }
  .vazio strong { color: var(--texto); display: block; font-size: 17px; margin-bottom: 4px; }

  .barra-envio { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--borda);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 18px rgba(122,16,38,.08); }
  .barra-envio .pagina { padding: 0; }
  .barra-envio .btn { width: 100%; font-size: 18px; min-height: 56px; }
  .barra-envio .legenda { text-align: center; font-size: 12.5px; color: var(--suave); margin-top: 6px; }
  .contador { background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; font-size: 14px; }

  .toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #1d2633; color: #fff; padding: 11px 14px; border-radius: 12px; font-size: 15px;
    display: flex; gap: 14px; align-items: center; transition: .25s; pointer-events: none; max-width: 92vw; z-index: 10; }
  .toast.visivel { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { background: none; border: 0; color: var(--destaque); font-weight: 700; padding: 4px; }

  /* Abertura (5 s): 0–2 s a logo surge do preto; 2–5 s o brilho passa e a barra enche */
  .abertura { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; transition: opacity .5s ease; }
  .abertura .logo-brilho { position: relative; width: min(74vw, 380px); isolation: isolate; line-height: 0;
    animation: surgir 2s ease-in-out both; }
  @keyframes surgir { from { opacity: 0; } to { opacity: 1; } }
  .abertura img { width: 100%; height: auto; display: block; }
  /* brilho que passa da esquerda para a direita, só sobre a logo (o fundo preto continua preto) */
  .abertura .logo-brilho::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, rgba(255,247,214,0) 42%, rgba(255,247,214,.6) 47.5%, rgba(255,253,244,.95) 50%, rgba(255,247,214,.6) 52.5%, rgba(255,247,214,0) 58%);
    background-size: 250% 100%; background-position: 100% 0;
    /* a própria logo serve de máscara: o brilho só aparece no dourado */
    mask-image: var(--logo-mascara); mask-mode: luminance; mask-size: 100% 100%; mask-repeat: no-repeat;
    animation: brilho 1.5s ease-in-out 2s 2 both; }
  @keyframes brilho { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  .abertura .carregando { width: min(56vw, 270px); margin-top: 30px; text-align: center; animation: aparecer .5s ease-out 2s both; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .abertura .bem-vindo { color: #ead39a; font-size: 14px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase;
    padding-left: .34em; margin-bottom: 14px; }
  .abertura .barra { height: 4px; border-radius: 4px; background: rgba(226,182,90,.16); overflow: hidden; }
  .abertura .barra i { display: block; width: 100%; height: 100%; border-radius: inherit; transform-origin: left center;
    background: linear-gradient(90deg, #9c6f22, #e2b65a 55%, #fff1c4); box-shadow: 0 0 12px rgba(243,212,138,.55);
    animation: encher 3s cubic-bezier(.45,.05,.35,1) 2s both; }
  @keyframes encher { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .abertura .logo-brilho, .abertura .carregando { animation: none; }
    .abertura .logo-brilho::after { animation: none; opacity: 0; }
    .abertura .barra i { animation: none; transform: none; }
  }
  .abertura.saindo { opacity: 0; pointer-events: none; }
  .config { background: #fff; border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px; margin-top: 18px; }
  .config h2 { margin: 0 0 6px; font-size: 19px; }
  .config p { color: var(--suave); margin: 0 0 6px; font-size: 15px; }
  .config h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--marca);
    margin: 22px 0 8px; padding-top: 16px; border-top: 1px solid var(--borda); }
  .config h3:first-of-type { border-top: 0; padding-top: 0; margin-top: 14px; }
  .config textarea { width: 100%; border: 1px solid var(--borda); border-radius: 10px; padding: 11px 12px;
    min-height: 84px; resize: vertical; font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--marca-suave); color: var(--marca);
    border-radius: 999px; padding: 6px 6px 6px 13px; font-weight: 650; font-size: 15px; }
  .chip button { border: 0; background: rgba(122,16,38,.12); color: var(--marca); width: 26px; height: 26px;
    border-radius: 50%; font-size: 15px; line-height: 1; display: grid; place-items: center; }
  .linha-add { display: flex; gap: 8px; margin-top: 10px; }
  .linha-add input { flex: 1; min-width: 0; border: 1px solid var(--borda); border-radius: 10px; padding: 11px 12px; min-height: 46px; }
  .linha-dias { display: flex; align-items: center; gap: 10px; }
  .linha-dias input { width: 90px !important; text-align: center; }
  .config img.previa-cfg { width: 62%; display: block; margin: 12px auto 0; border-radius: 12px; aspect-ratio: 4 / 5; background: #EFE2E4; }
  .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .filtro { flex: none; border: 1px solid var(--borda); background: #fff; color: var(--texto); border-radius: 999px;
    padding: 8px 13px; font-size: 14px; font-weight: 600; min-height: 38px; }
  .filtro.ativo { background: var(--marca); border-color: var(--marca); color: #fff; }
  .filtro .n { opacity: .75; margin-left: 4px; font-weight: 500; }
  .config details { margin-top: 20px; border-top: 1px solid var(--borda); padding-top: 12px; }
  .config details summary { color: var(--suave); font-weight: 650; cursor: pointer; padding: 6px 0; }
  .credito { text-align: center; color: var(--suave); font-size: 12.5px; margin: 22px 0 4px; letter-spacing: .3px; }
</style>
</head>

<div class="abertura" id="abertura" aria-hidden="true"><div class="logo-brilho"><img id="logoAbertura" alt="Pania Company"></div><div class="carregando"><div class="bem-vindo">Bem-vindo</div><div class="barra"><i></i></div></div></div>

<header class="topo">
  <div class="pagina">
    <div class="linha">
      <div style="flex:1">
        <h1 id="tituloApp">Agile Consultoria</h1>
        <div class="sub" id="subtitulo">&nbsp;</div>
      </div>
      <button class="icone-btn" id="btnConfig" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <button class="btn btn-primario" id="btnBuscar">Buscar vagas novas</button>
  </div>
</header>

<main class="pagina" id="principal"></main>

<div class="barra-envio oculto" id="barraEnvio">
  <div class="pagina">
    <button class="btn btn-verde" id="btnEnviarProxima">
      <span>Enviar próxima vaga</span><span class="contador" id="contador">1 de 1</span>
    </button>
    <div class="legenda">Abre o WhatsApp com a arte e o texto prontos. Escolha o grupo e envie.</div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastTexto"></span><button id="toastAcao" class="oculto">Desfazer</button></div>

// ------------------------- Áreas (filtro da lista) -------------------------
const AREAS = [   // ordem = prioridade na hora de classificar pelo título
  { id: 'aprendiz', nome: 'Aprendiz/Estágio', re: /aprendiz|estagi|trainee/ },
  { id: 'ti', nome: 'TI', re: /desenvolvedor|developer|programador|software|sistemas|devops|front.?end|back.?end|full.?stack|\bdados\b|\bdata\b|cloud|infraestrutura|\bredes\b|suporte tecnico|help.?desk|\bti\b|\bit\b|informatica|tecnologia da informacao|react|angular|javascript|\bjava\b|python|\.net|\bsap\b|\bqa\b|\bux\b|\bui\b|\bweb\b/ },

  { id: 'administrativo', nome: 'Administrativo', re: /administrativ|\badm\b|secretari|financeir|contab|fiscal|\brh\b|recursos humanos|departamento pessoal|\bdp\b|faturamento|compras|juridic|escritorio|controller|tesourar|cobranca|credito/ },
];
// ordem dos botões na tela (TI fica no fim de propósito: o grupo é de todas as áreas)
const ORDEM_BOTOES = ['administrativo', 'vendas', 'producao', 'logistica', 'saude', 'servicos', 'aprendiz', 'ti', 'outras'];
const OUTRAS = { id: 'outras', nome: 'Outras' };

function areaDaVaga(v) {
  const t = String(v.titulo || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return AREAS.find((a) => a.re.test(t)) || OUTRAS;
}

function vagasVisiveis() {
  if (estado.filtroArea === 'todas') return estado.vagas;
  const lista = estado.vagas.filter((v) => areaDaVaga(v).id === estado.filtroArea);
  if (!lista.length) { estado.filtroArea = 'todas'; return estado.vagas; }
  return lista;
}

function htmlFiltros() {
  const contagem = {};
  estado.vagas.forEach((v) => { const a = areaDaVaga(v); contagem[a.id] = (contagem[a.id] || 0) + 1; });
  const botoes = [{ id: 'todas', nome: 'Todas', n: estado.vagas.length }]
    .concat(ORDEM_BOTOES.map((id) => AREAS.concat([OUTRAS]).find((a) => a.id === id))
      .filter((a) => contagem[a.id]).map((a) => ({ id: a.id, nome: a.nome, n: contagem[a.id] })));
  if (botoes.length <= 2) return '';
  return `<div class="filtros" role="tablist" aria-label="Filtrar por área">${botoes.map((b) =>
    `<button class="filtro ${estado.filtroArea === b.id ? 'ativo' : ''}" data-area="${b.id}" role="tab" aria-selected="${estado.filtroArea === b.id}">${esc(b.nome)}<span class="n">${b.n}</span></button>`).join('')}</div>`;
}

// ------------------------- Configuração -------------------------
function lerHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return;
  if (h === 'demo') { estado.demo = true; return; }
  const p = new URLSearchParams(h);
  if (p.get('api') && p.get('chave')) {
    estado.config = { api: p.get('api').trim(), chave: p.get('chave').trim() };
    armazenamento.gravar('vagas_config', estado.config);
    estado.demo = false;
    history.replaceState(null, '', location.pathname + location.search);
  }
}

// ------------------------- Comunicação -------------------------
async function chamar(acao, params) {
  if (estado.demo) return demo.chamar(acao, params || {});
  const url = new URL(estado.config.api);
  url.searchParams.set('acao', acao);
  url.searchParams.set('chave', estado.config.chave);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  let resp;
  try {
    resp = await fetch(url.toString(), { redirect: 'follow', credentials: 'omit' });
  } catch (e) {
    throw new Error('Sem conexão com o Google. Confira a internet e tente de novo.');
  }
  let json;
  try { json = await resp.json(); } catch (e) {
    throw new Error('O Google respondeu algo inesperado. Confira se o app da Web está implantado com acesso "Qualquer pessoa".');
  }
  if (!json.ok) throw new Error(json.erro || 'Erro desconhecido');
  return json;
}

async function sincronizarPendentes() {
  const fila = estado.sincronizar.slice();
  for (const item of fila) {
    try {
      await chamar(item.acao, item.params);
      estado.sincronizar = estado.sincronizar.filter((x) => x !== item && !(x.acao === item.acao && x.params.id === item.params.id));
      armazenamento.gravar('vagas_sync', estado.sincronizar);
    } catch (e) { break; }
  }
}

function registrar(acao, params) {
  estado.sincronizar.push({ acao, params });
  armazenamento.gravar('vagas_sync', estado.sincronizar);
  sincronizarPendentes();
}

function aplicarAjustes(aj) {
  if (!aj) return;
  estado.ajustesServidor = aj;
  AJUSTES.CABECALHO_MSG = aj.msgCabecalho || PADRAO.CABECALHO_MSG;
  AJUSTES.CHAMADA_MSG = aj.msgChamada || PADRAO.CHAMADA_MSG;
  AJUSTES.RODAPE_MSG = aj.msgRodape || PADRAO.RODAPE_MSG;
  AJUSTES.SELO_ARTE = aj.arteSelo || PADRAO.SELO_ARTE;
  AJUSTES.CHAMADA_ARTE = aj.arteChamada || PADRAO.CHAMADA_ARTE;
}

function aplicarResposta(r) {
  aplicarAjustes(r.ajustes);
  const jaTratadas = new Set(estado.sincronizar.map((x) => x.params.id));
  estado.vagas = (r.pendentes || []).filter((v) => !jaTratadas.has(v.id)).map((v) => Object.assign({}, v, estado.editando[v.id] || {}));
  const ids = new Set(estado.vagas.map((v) => v.id));
  Object.keys(estado.editando).forEach((id) => { if (!ids.has(id)) delete estado.editando[id]; });
  armazenamento.gravar('vagas_edicoes', estado.editando);
  estado.descartadas = r.descartadas || [];
  estado.ultimaBusca = r.ultimaBusca || 0;
  estado.linkedinLimitou = !!r.linkedinLimitou;
  estado.aguardando = r.aguardando || 0;
  estado.agenda = r.agenda || '';
}

async function carregarFila() {
  estado.erro = '';
  try {
    await sincronizarPendentes();
    aplicarResposta(await chamar('listar'));
  } catch (e) { estado.erro = e.message; }
  desenhar();
}

async function buscar() {
  if (estado.carregando) return;
  estado.carregando = true; estado.erro = ''; estado.resumoBusca = '';
  desenhar();
  try {
    await sincronizarPendentes();
    const r = await chamar('buscar');
    aplicarResposta(r);
    const partes = [];
    partes.push(r.vagasNovas === 1 ? '1 vaga nova' : (r.vagasNovas || 0) + ' vagas novas');
    partes.push((r.descartadas || []).length + ' descartada(s)');
    partes.push(estado.vagas.length + ' pronta(s) para enviar');
    estado.resumoBusca = partes.join(' · ');
  } catch (e) { estado.erro = e.message; }
  estado.carregando = false;
  desenhar();
}

// ------------------------- Mensagem -------------------------
function linhaDetalhes(v) {
  const partes = [];
  if (v.modalidade) partes.push('Modalidade ' + v.modalidade);
  if (v.jornada) partes.push(v.jornada);
  return partes.join(' | ');
}

const comPonto = (t) => { t = String(t || '').trim().replace(/[;,]+$/, ''); return /[.!?]$/.test(t) ? t : t + '.'; };

// Padrão da cliente:
// 📢 OPORTUNIDADE DE EMPREGO! / cargo / 📍 cidade, ⏰ jornada, Empresa / 🎁 Benefícios / chamada / 🔗 link / rodapé
function montarMensagem(v) {
  const l = [AJUSTES.CABECALHO_MSG, '', v.titulo || '(cargo)'];
  const bloco = [];
  if (v.local) bloco.push('📍 ' + v.local);
  if (v.jornada) bloco.push('⏰ ' + comPonto(v.jornada));
  if (v.empresa) bloco.push('Empresa: ' + v.empresa);
  if (bloco.length) l.push('', ...bloco);
  const ben = String(v.beneficios || '').trim();
  if (ben) l.push('', '🎁 Benefícios: ' + comPonto(ben.charAt(0).toUpperCase() + ben.slice(1)));
  l.push('', AJUSTES.CHAMADA_MSG, '', '🔗 ' + (v.linkCandidatura || v.link));
  if (AJUSTES.RODAPE_MSG.trim()) l.push('', AJUSTES.RODAPE_MSG.trim());
  return l.join('\n');
}

// ------------------------- Arte -------------------------
const artes = new Map(); // id -> { chave, promessa, blob, url }

function chaveArte(v) {
  return [v.titulo, v.empresa, v.local, v.modalidade, v.jornada, v.logo ? v.logo.length : 0, AJUSTES.SELO_ARTE, AJUSTES.CHAMADA_ARTE].join('|');
}

function obterArte(v) {
  const chave = chaveArte(v);
  const atual = artes.get(v.id);
  if (atual && atual.chave === chave) return atual.promessa;
  if (atual && atual.url) URL.revokeObjectURL(atual.url);
  const item = { chave };
  item.promessa = desenharArte(v).then((blob) => { item.blob = blob; item.url = URL.createObjectURL(blob); return item; });
  artes.set(v.id, item);
  return item.promessa;
}

function rotuloModalidade(m) {
  return { 'presencial': 'Presencial', 'híbrida': 'Híbrido', 'remota': 'Remoto' }[m] || '';
}

function quebrarLinhas(g, texto, largura) {
  // pedaços: palavras, e palavras com hífen podem quebrar depois do hífen (Administrativo-|Financeiro)
  const pedacos = [];
  String(texto || '').split(/\s+/).filter(Boolean).forEach((palavra) => {
    palavra.split(/(?<=-)(?=.)/).forEach((parte, i) => pedacos.push({ t: parte, espaco: i === 0 }));
  });
  const linhas = [];
  let atual = '';
  pedacos.forEach(({ t, espaco }) => {
    const teste = atual ? atual + (espaco ? ' ' : '') + t : t;
    if (g.measureText(teste).width <= largura) { atual = teste; return; }
    if (atual) linhas.push(atual);
    // pedaço maior que a linha: quebra no meio
    while (g.measureText(t).width > largura) {
      let i = t.length;
      while (i > 1 && g.measureText(t.slice(0, i) + '-').width > largura) i--;
      linhas.push(t.slice(0, i) + '-');
      t = t.slice(i);
    }
    atual = t;
  });
  if (atual) linhas.push(atual);
  return linhas;
}

function limitarLinhas(g, linhas, max, largura) {
  if (linhas.length <= max) return linhas;
  const corte = linhas.slice(0, max);
  let ultima = corte[max - 1];
  while (ultima.length > 1 && g.measureText(ultima + '…').width > largura) ultima = ultima.slice(0, -1);
  corte[max - 1] = ultima.trim() + '…';
  return corte;
}

function retanguloRedondo(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function iconeLocal(g, x, y, s, cor, corFundo) {
  const cx = x + s / 2, cy = y + s * 0.38, r = s * 0.34;
  g.fillStyle = cor;
  g.beginPath();
  g.arc(cx, cy, r, Math.PI * 0.85, Math.PI * 2.15);
  g.lineTo(cx, y + s * 0.98);
  g.closePath();
  g.fill();
  g.fillStyle = corFundo;
  g.beginPath(); g.arc(cx, cy, r * 0.42, 0, Math.PI * 2); g.fill();
}

function iconeMaleta(g, x, y, s, cor) {
  g.fillStyle = cor; g.strokeStyle = cor; g.lineWidth = s * 0.1;
  retanguloRedondo(g, x + s * 0.32, y + s * 0.1, s * 0.36, s * 0.3, s * 0.06); g.stroke();
  retanguloRedondo(g, x, y + s * 0.3, s, s * 0.62, s * 0.1); g.fill();
}

function iconeRelogio(g, x, y, s, cor) {
  const cx = x + s / 2, cy = y + s / 2, r = s * 0.42;
  g.strokeStyle = cor; g.lineWidth = s * 0.11; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(cx, cy - r * 0.6); g.lineTo(cx, cy); g.lineTo(cx + r * 0.45, cy + r * 0.3); g.stroke();
}

function iniciais(nome) {
  const p = String(nome || '?').replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
  return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function carregarImagem(src) {
  return new Promise((ok) => {
    if (!src) return ok(null);
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => ok(null);
    img.src = src;
  });
}

async function desenharArte(v, ajustesArte) {
  const W = 1080, H = 1350, M = 80, LARG = W - 2 * M;
  const A = ajustesArte || AJUSTES;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const clara = A.ARTE_CLARA !== false && !!A.CLARA;
  const K = A.CLARA || {};
  const tonsOuro = clara ? K.OURO : [A.OURO_1, A.OURO_2, A.OURO_3];
  const ouro = (x0, x1) => {
    const gr = g.createLinearGradient(x0, 0, x1, 0);
    gr.addColorStop(0, tonsOuro[0]); gr.addColorStop(0.5, tonsOuro[1]); gr.addColorStop(1, tonsOuro[2]);
    return gr;
  };
  // cores de cada parte (fundo claro ou fundo vinho)
  const C = clara
    ? { titulo: K.VINHO, empresa: K.TEXTO, info: K.TEXTO, icone: K.OURO[2], furoIcone: K.CREME_TOPO,
        selo: K.VINHO, textoSelo: K.SOBRE_VINHO, botao: K.VINHO, textoBotao: K.SOBRE_VINHO, iniciais: K.VINHO }
    : { titulo: '#fff', empresa: A.COR_EMPRESA, info: '#fff', icone: A.OURO_2, furoIcone: A.COR_FUNDO_2,
        selo: null, textoSelo: A.COR_SOBRE_OURO, botao: null, textoBotao: A.COR_SOBRE_OURO, iniciais: A.COR_FUNDO_2 };

  if (clara) {
    // fundo creme, neutro para facilitar a leitura, com detalhes discretos em rosé e dourado
    const fundo = g.createLinearGradient(0, 0, 0, H);
    fundo.addColorStop(0, K.CREME_TOPO); fundo.addColorStop(1, K.CREME);
    g.fillStyle = fundo; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(202,161,167,0.28)';
    g.beginPath(); g.arc(W + 30, -60, 400, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(183,137,43,0.12)';
    g.beginPath(); g.arc(-120, H - 330, 300, 0, Math.PI * 2); g.fill();
  } else {
    // fundo vinho com brilho suave
    const fundo = g.createLinearGradient(0, 0, W, H);
    fundo.addColorStop(0, A.COR_FUNDO); fundo.addColorStop(1, A.COR_FUNDO_2);
    g.fillStyle = fundo; g.fillRect(0, 0, W, H);
    const brilho = g.createRadialGradient(W * 0.86, 130, 10, W * 0.86, 130, 620);
    brilho.addColorStop(0, 'rgba(255,255,255,0.11)'); brilho.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = brilho; g.fillRect(0, 0, W, H);
    const brilho2 = g.createRadialGradient(0, H - 260, 10, 0, H - 260, 460);
    brilho2.addColorStop(0, 'rgba(244,214,136,0.10)'); brilho2.addColorStop(1, 'rgba(244,214,136,0)');
    g.fillStyle = brilho2; g.fillRect(0, 0, W, H);
  }

  // rodapé branco com a logo da Agile (quem divulga)
  const hRod = 184, yRod = H - hRod;
  g.fillStyle = '#fff'; g.fillRect(0, yRod, W, hRod);
  g.fillStyle = ouro(0, W); g.fillRect(0, yRod, W, 8);
  const agile = await carregarImagem(LOGOS.agile);
  if (agile) {
    const h = 146, w = agile.width * h / agile.height;
    g.drawImage(agile, (W - w) / 2, yRod + 8 + (hRod - 8 - h) / 2, w, h);
  }

  // logo da empresa contratante (destaque)
  const L = 232, yL = 80;
  g.save();
  g.shadowColor = clara ? 'rgba(43,27,31,0.16)' : 'rgba(0,0,0,0.35)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
  g.fillStyle = '#fff'; retanguloRedondo(g, M, yL, L, L, 40); g.fill();
  g.restore();
  g.strokeStyle = ouro(M, M + L); g.lineWidth = 5; retanguloRedondo(g, M, yL, L, L, 40); g.stroke();
  const logo = await carregarImagem(v.logo);
  if (logo) {
    const pad = 30, area = L - 2 * pad;
    const escala = Math.min(area / logo.width, area / logo.height);
    const w = logo.width * escala, h = logo.height * escala;
    g.save(); retanguloRedondo(g, M + 3, yL + 3, L - 6, L - 6, 37); g.clip();
    g.drawImage(logo, M + (L - w) / 2, yL + (L - h) / 2, w, h);
    g.restore();
  } else {
    g.fillStyle = C.iniciais; g.font = `800 96px ${FONTE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(iniciais(v.empresa), M + L / 2, yL + L / 2 + 6);
  }

  // selo "VAGA ABERTA"
  g.font = `800 50px ${FONTE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const selo = A.SELO_ARTE;
  const ws = g.measureText(selo).width + 88, hs = 104;
  const xs = W - M - ws, ys = yL + (L - hs) / 2;
  g.fillStyle = C.selo || ouro(xs, xs + ws); retanguloRedondo(g, xs, ys, ws, hs, hs / 2); g.fill();
  g.fillStyle = C.textoSelo; g.fillText(selo, xs + ws / 2, ys + hs / 2 + 2);

  // arco dourado (inspirado no traço da logo da Agile)
  const yArco = yL + L + 58;
  g.fillStyle = ouro(M, W - M);
  g.beginPath();
  g.moveTo(M, yArco + 20);
  g.quadraticCurveTo(W / 2, yArco - 36, W - M, yArco + 20);
  g.quadraticCurveTo(W / 2, yArco - 14, M, yArco + 20);
  g.closePath(); g.fill();

  // chamada (posição fixa acima do rodapé)
  const hb = 112, yb = yRod - 50 - hb;

  // medidas do conteúdo
  const topo = yArco + 56, limite = yb - 40;
  const linhasInfo = [
    ['local', v.local],
    ['maleta', rotuloModalidade(v.modalidade)],
    ['relogio', v.jornada],
  ].filter((x) => x[1]);
  const altInfo = linhasInfo.length * 62;
  g.textAlign = 'left';
  let linhasEmpresa = [], altEmpresa = 0, tam = 100, linhasTitulo = [], coube = false;
  const tentativas = [[2, 4, 60], [1, 4, 52], [1, 3, 52]]; // [linhas da empresa, linhas do título, fonte mínima]
  for (const [maxEmp, maxTit, minTam] of tentativas) {
    g.font = `600 48px ${FONTE}`;
    linhasEmpresa = limitarLinhas(g, quebrarLinhas(g, v.empresa || '', LARG), maxEmp, LARG);
    altEmpresa = linhasEmpresa.length ? linhasEmpresa.length * 58 + 18 : 0;
    for (tam = 100; tam >= minTam; tam -= 4) {
      g.font = `800 ${tam}px ${FONTE}`;
      linhasTitulo = limitarLinhas(g, quebrarLinhas(g, v.titulo || '(cargo)', LARG), maxTit, LARG);
      const alt = linhasTitulo.length * tam * 1.1 + altEmpresa + (altInfo ? 36 + altInfo : 0);
      if (topo + alt <= limite) { coube = true; break; }
    }
    if (coube) break;
  }
  if (!coube) tam = 52;
  g.font = `800 ${tam}px ${FONTE}`;

  // título
  let y = topo;
  g.fillStyle = C.titulo; g.textBaseline = 'top';
  linhasTitulo.forEach((linha) => { g.fillText(linha, M, y); y += tam * 1.1; });

  // empresa
  if (linhasEmpresa.length) {
    y += 18;
    g.font = `600 48px ${FONTE}`; g.fillStyle = C.empresa;
    linhasEmpresa.forEach((linha) => { g.fillText(linha, M, y); y += 58; });
  }

  // informações
  if (linhasInfo.length) {
    y += 36;
    g.font = `500 44px ${FONTE}`; g.textBaseline = 'middle';
    linhasInfo.forEach(([icone, texto]) => {
      const s = 44, iy = y + 6;
      if (icone === 'local') iconeLocal(g, M, iy, s, C.icone, C.furoIcone);
      if (icone === 'maleta') iconeMaleta(g, M, iy, s, C.icone);
      if (icone === 'relogio') iconeRelogio(g, M, iy, s, C.icone);
      g.fillStyle = C.info;
      g.fillText(limitarLinhas(g, [texto], 1, LARG - 76)[0], M + 76, iy + s / 2 + 2);
      y += 62;
    });
  }

  // botão "Acesse o link"
  g.fillStyle = C.botao || ouro(M, W - M); retanguloRedondo(g, M, yb, LARG, hb, hb / 2); g.fill();
  g.fillStyle = C.textoBotao; g.font = `800 52px ${FONTE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(limitarLinhas(g, [A.CHAMADA_ARTE], 1, LARG - 60)[0], W / 2, yb + hb / 2 + 2);

  return new Promise((ok) => c.toBlob(ok, 'image/png'));
}

// ------------------------- Enviar / descartar -------------------------
function nomeArquivo(v) {
  const base = (v.titulo || 'vaga').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  return 'vaga-' + (base || v.id) + '.png';
}

async function compartilhar(v) {
  const arte = await obterArte(v);
  const arquivo = new File([arte.blob], nomeArquivo(v), { type: 'image/png', lastModified: Date.now() });
  const texto = montarMensagem(v);
  if (navigator.canShare && navigator.canShare({ files: [arquivo], text: texto })) {
    await navigator.share({ files: [arquivo], text: texto });
    return true;
  }
  // Plano B (computador ou navegador sem compartilhamento de arquivo): baixa a arte e abre o WhatsApp só com o texto
  const a = document.createElement('a');
  a.href = arte.url; a.download = arquivo.name; document.body.appendChild(a); a.click(); a.remove();
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  aviso('A arte foi baixada. Anexe a imagem na conversa do WhatsApp.');
  return true;
}

let enviando = false;
async function enviar(id) {
  if (enviando) return;
  const v = estado.vagas.find((x) => x.id === id);
  if (!v) return;
  enviando = true;
  try {
    await compartilhar(v);
  } catch (e) {
    enviando = false;
    if (e && e.name === 'AbortError') return; // ela fechou o compartilhamento
    aviso('Não deu para abrir o compartilhamento: ' + (e.message || e));
    return;
  }
  enviando = false;
  registrar('enviada', { id: v.id, empresaOriginal: v.empresaOriginal || '', empresa: v.empresa || '' });
  removerDaTela(v.id, () => aviso('Vaga enviada ✓'));
}

let descarteDesfazer = null;
function descartar(id) {
  const i = estado.vagas.findIndex((x) => x.id === id);
  if (i === -1) return;
  const v = estado.vagas[i];
  if (descarteDesfazer) descarteDesfazer.confirmar();
  const tempo = setTimeout(() => confirmar(), 5000);
  function confirmar() { clearTimeout(tempo); descarteDesfazer = null; registrar('descartar', { id: v.id }); }
  descarteDesfazer = {
    confirmar,
    desfazer() {
      clearTimeout(tempo); descarteDesfazer = null;
      estado.vagas.splice(Math.min(i, estado.vagas.length), 0, v);
      desenhar();
    },
  };
  removerDaTela(id, () => aviso('Vaga descartada', 'Desfazer', () => descarteDesfazer && descarteDesfazer.desfazer()));
}

function removerDaTela(id, depois) {
  const el = document.querySelector(`[data-cartao="${id}"]`);
  const tirar = () => {
    estado.vagas = estado.vagas.filter((x) => x.id !== id);
    if (estado.aberta === id) estado.aberta = null;
    if (history.state && history.state.tela === 'vaga' && history.state.id === id) history.back();
    desenhar();
    if (depois) depois();
  };
  if (el) { el.classList.add('saindo'); setTimeout(tirar, 230); } else tirar();
}

let tempoAviso = null;
function aviso(texto, rotuloAcao, acao) {
  $('toastTexto').textContent = texto;
  const b = $('toastAcao');
  if (rotuloAcao) { b.textContent = rotuloAcao; b.classList.remove('oculto'); b.onclick = () => { esconderAviso(); acao(); }; }
  else b.classList.add('oculto');
  $('toast').classList.add('visivel');
  clearTimeout(tempoAviso);
  tempoAviso = setTimeout(esconderAviso, rotuloAcao ? 5000 : 3200);
}
function esconderAviso() { $('toast').classList.remove('visivel'); }

// ------------------------- Edição -------------------------
const CAMPOS = ['titulo', 'empresa', 'local', 'modalidade', 'jornada', 'beneficios', 'linkCandidatura'];
let tempoEdicao = null;
function editar(id, campo, valor) {
  const v = estado.vagas.find((x) => x.id === id);
  if (!v) return;
  v[campo] = valor;
  estado.editando[id] = Object.assign(estado.editando[id] || {}, { [campo]: valor });
  armazenamento.gravar('vagas_edicoes', estado.editando);
  const previa = document.querySelector(`[data-previa="${id}"]`);
  if (previa) previa.textContent = montarMensagem(v);
  const cab = document.querySelector(`[data-cartao="${id}"] .titulo`);
  if (cab && campo === 'titulo') cab.lastChild.textContent = valor;
  clearTimeout(tempoEdicao);
  tempoEdicao = setTimeout(() => atualizarArte(v), 350);
}

function atualizarArte(v) {
  obterArte(v).then((a) => {
    document.querySelectorAll(`[data-arte="${v.id}"]`).forEach((img) => { img.src = a.url; });
    document.querySelectorAll(`[data-mini="${v.id}"]`).forEach((d) => { d.style.backgroundImage = `url("${a.url}")`; });
  });
}

// ------------------------- Tela -------------------------
function quando(ms) {
  if (!ms) return 'Vagas · ainda não buscou';
  const d = new Date(ms), hoje = new Date();
  const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const ontem = new Date(hoje); ontem.setDate(hoje.getDate() - 1);
  if (d.toDateString() === hoje.toDateString()) return 'Vagas · última busca hoje às ' + hora;
  if (d.toDateString() === ontem.toDateString()) return 'Vagas · última busca ontem às ' + hora;
  return 'Vagas · última busca em ' + d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' + hora;
}

function desenhar() {
  document.title = AJUSTES.TITULO_APP;
  $('tituloApp').textContent = AJUSTES.TITULO_APP + (estado.demo ? ' (demonstração)' : '');
  const semConfig = !estado.demo && !(estado.config && estado.config.api && estado.config.chave);
  const main = $('principal');

  if (semConfig) { telaConexao(main); return; }
  if (estado.telaConfig) { telaConfiguracoes(main); return; }

  $('btnBuscar').classList.remove('oculto');
  $('subtitulo').textContent = quando(estado.ultimaBusca);
  $('btnBuscar').disabled = estado.carregando;
  $('btnBuscar').innerHTML = estado.carregando
    ? '<span class="girando"></span> Procurando e conferindo vagas…'
    : 'Buscar vagas novas';

  let html = '';
  if (estado.carregando) html += '<div class="faixa info">Pode levar até 2 minutos: o app confere cada vaga no LinkedIn com calma para não ser bloqueado.</div>';
  if (estado.erro) html += `<div class="faixa erro">${esc(estado.erro)}</div>`;
  if (estado.resumoBusca && !estado.carregando) html += `<div class="faixa info">${esc(estado.resumoBusca)}</div>`;
  if (estado.linkedinLimitou && !estado.carregando && estado.vagas.some((v) => !v.conferida)) {
    html += '<div class="faixa alerta">O LinkedIn limitou as consultas agora. As vagas com ⚠ não foram conferidas: abra o link antes de enviar, ou busque de novo mais tarde.</div>';
  }

  if (estado.aguardando && !estado.carregando) {
    html += `<div class="faixa info">${estado.aguardando === 1 ? '1 vaga nova ainda vai ser conferida no LinkedIn e aparece' : estado.aguardando + ' vagas novas ainda vão ser conferidas no LinkedIn e aparecem'} na próxima busca.</div>`;
  }
  const visiveis = vagasVisiveis();
  if (estado.vagas.length) {
    const filtrada = visiveis.length !== estado.vagas.length;
    html += `<h2 class="secao">Prontas para enviar (${filtrada ? visiveis.length + ' de ' + estado.vagas.length : estado.vagas.length})</h2>`;
    html += htmlFiltros();
    html += visiveis.map(htmlCartao).join('');
  } else if (!estado.carregando) {
    html += `<div class="vazio"><strong>Nenhuma vaga esperando</strong>${estado.agenda
      ? 'O app busca vagas sozinho todo dia por volta de ' + esc(estado.agenda) + '. Se quiser, toque em "Buscar vagas novas".'
      : 'Toque em "Buscar vagas novas" para procurar no LinkedIn.'}</div>`;
  }

  if (estado.descartadas.length) {
    html += `<details class="descartadas"><summary>Descartadas na última busca (${estado.descartadas.length})</summary>
      ${estado.descartadas.map((d) => `
        <div class="descartada"><div>${esc(d.titulo)}${d.empresa ? ' · ' + esc(d.empresa) : ''}</div>
          <div class="motivo">${esc(d.motivo)}${d.link ? ` · <a href="${esc(d.link)}" target="_blank" rel="noopener">ver</a>` : ''}</div></div>`).join('')}
    </details>`;
  }
  main.innerHTML = html;

  // barra de envio
  const total = visiveis.length;
  $('barraEnvio').classList.toggle('oculto', !total || estado.carregando);
  $('contador').textContent = '1 de ' + total;

  // artes
  estado.vagas.forEach((v) => {
    obterArte(v).then((a) => {
      const mini = document.querySelector(`[data-mini="${v.id}"]`);
      if (mini) mini.style.backgroundImage = `url("${a.url}")`;
      const img = document.querySelector(`[data-arte="${v.id}"]`);
      if (img) img.src = a.url;
    });
  });
}

// ------------------------- Navegação (botão "voltar" do celular) -------------------------
// O app é uma página só. Cada tela "por cima" da lista (Configurações, revisão de uma vaga) cria um passo
// no histórico; assim o "voltar" do Android volta para a tela anterior em vez de fechar o app.
let depoisDeVoltar = null;
function voltarEntao(fn) {
  if (history.state && history.state.tela) { depoisDeVoltar = fn || null; history.back(); }
  else if (fn) fn();
}
function abrirConfig() {
  estado.telaConfig = true; estado.rascunho = null;
  history.pushState({ tela: 'config' }, '');
  desenhar(); window.scrollTo(0, 0);
}
function fecharConfig(depois) {
  if (history.state && history.state.tela === 'config') { voltarEntao(depois); return; }
  estado.telaConfig = false; estado.rascunho = null; desenhar();
  if (depois) depois();
}
function abrirVaga(id) {
  const passo = { tela: 'vaga', id };
  if (history.state && history.state.tela === 'vaga') history.replaceState(passo, ''); else history.pushState(passo, '');
  estado.aberta = id; desenhar();
  const el = document.querySelector(`[data-cartao="${id}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function fecharVaga() {
  if (history.state && history.state.tela === 'vaga') { history.back(); return; }
  estado.aberta = null; desenhar();
}
window.addEventListener('popstate', (e) => {
  const passo = e.state || {};
  estado.telaConfig = passo.tela === 'config';
  if (!estado.telaConfig) estado.rascunho = null;
  if (passo.tela === 'vaga') estado.aberta = estado.vagas.some((v) => v.id === passo.id) ? passo.id : null;
  else if (passo.tela !== 'config') estado.aberta = null;
  desenhar();
  if (depoisDeVoltar) { const fn = depoisDeVoltar; depoisDeVoltar = null; fn(); }
});

      { id: '2', titulo: 'Vendedor Interno', empresa: 'Empresa G', motivo: 'Fora da região (São Carlos/SC)', link: 'https://www.linkedin.com/' },
      { id: '3', titulo: 'Assistente Administrativo', empresa: 'Empresa H', motivo: 'Publicada há 30 dias', link: 'https://www.linkedin.com/' },
    ];
    if (acao === 'buscar') demo.buscou = Date.now();
    return { ok: true, pendentes: demo.fila.slice(), descartadas: demo.buscou ? descartadas : [],
      ultimaBusca: demo.buscou || 0, linkedinLimitou: !!demo.buscou, vagasNovas: 7, agenda: '11:30 e 17:00', ajustes: demo.ajustes };
  },
};

(function abertura() {
  const el = $('abertura');
  $('logoAbertura').src = LOGOS.pania;
  el.querySelector('.logo-brilho').style.setProperty('--logo-mascara', `url("${LOGOS.pania}")`);
  let fechada = false;
  const tema = document.querySelector('meta[name="theme-color"]');
  // durante a abertura a barra do celular fica preta; depois volta ao vinho do app
  const fechar = () => { if (fechada) return; fechada = true; el.classList.add('saindo'); if (tema) tema.content = '#FFFBF4'; setTimeout(() => el.remove(), 550); };
  el.addEventListener('click', fechar);
  setTimeout(fechar, AJUSTES.TEMPO_ABERTURA_MS);
})();
lerHash();
desenhar();
if (estado.demo || (estado.config && estado.config.api)) carregarFila();
